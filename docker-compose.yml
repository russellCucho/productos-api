services:
  oracle-db:
    image: container-registry.oracle.com/database/enterprise:12.2.0.1
    container_name: oracle_12c_enterprise
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      - ORACLE_SID=ORCLCDB
      - ORACLE_PDB=ORCLPDB1
      - ORACLE_PWD=oracle
    volumes:
      - oracle_data:/opt/oracle/oradata
    restart: always

volumes:
  oracle_data:
    driver: local